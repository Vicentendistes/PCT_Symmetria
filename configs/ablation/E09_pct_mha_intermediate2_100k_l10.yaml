# E09: PCT_MHA standard en Intermediate-2-100k con 10 capas.
# Objetivo: punto intermedio para medir escalamiento de profundidad antes del
# modelo final de 14 capas.
seed_everything: 13

trainer:
  accelerator: gpu
  devices: [0]
  precision: 32-true
  max_epochs: 200
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2

  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: ./logs
      name: ablation-E09-mha-standard-intermediate2-100k-l10

  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 50
        mode: min
        min_delta: 1e-4
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: best-{epoch:03d}-{val_loss:.5f}
        monitor: val_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  encoder_type: "PCT_MHA"
  learning_rate: 0.0001
  weight_decay: 1e-4
  amount_of_plane_normals_predicted: 32
  w_conf: 1.0
  w_vec: 1.0
  w_cent: 1.0
  w_rsd: 0.1
  input_channels: 3
  hidden_dim: 256
  num_oa_layers: 10
  num_heads: 8
  mha_attention_mode: "standard"

data:
  dataset_path: "/data/vimunoz/Symmetria-Intermediate-2-100k-preproc"
  batch_size: 32
  n_workers: 0
  persistent_workers: false
  shuffle: true
  transform:
    class_path: src.dataset.transforms.IdentityTransform.IdentityTransform
