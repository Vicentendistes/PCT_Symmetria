# E04: PCT base modular en Intermediate-2-10k.
# Objetivo: baseline limpio post-refactor para comparar encoders con la misma
# loss y el mismo protocolo experimental.
seed_everything: 13

trainer:
  accelerator: gpu
  devices: [0]
  precision: 32-true
  max_epochs: 200

  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: ./logs
      name: ablation-E04-pct-base-intermediate2-10k

  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 50
        mode: min
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: best-{epoch:03d}-{val_loss:.5f}
        monitor: val_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  encoder_type: "PCT"
  learning_rate: 0.001
  weight_decay: 1e-4
  amount_of_plane_normals_predicted: 32
  w_conf: 1.0
  w_vec: 1.0
  w_cent: 1.0
  w_rsd: 0.1
  input_channels: 3
  hidden_dim: 256
  num_oa_layers: 6

data:
  dataset_path: "/data/vimunoz/Symmetria-Intermediate-2-10k-preproc"
  batch_size: 32
  n_workers: 0
  persistent_workers: false
  shuffle: true
  transform:
    class_path: src.dataset.transforms.IdentityTransform.IdentityTransform
